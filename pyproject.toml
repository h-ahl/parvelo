[project]
name = "parvelo"
version = "0.1.0"
description = "Parallel map with an optional rich progress bar."
readme = "README.md"
requires-python = ">=3.13.0, <3.14.0"
dependencies = [
  "rich>=15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
homepage = "https://github.com/h-ahl/parvelo"
repository = "https://github.com/h-ahl/parvelo"
issues = "https://github.com/h-ahl/parvelo/issues"

[project.optional-dependencies]
lint = [
  "pre-commit>=4.6.0",
  "ty>=0.0.43",
  "ruff>=0.15.15",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "pytest-cov>=7.1.0",
  "pytest-mock>=3.15.1",
]
release = [
  "python-semantic-release>=10.5,<11.0",
  "twine>=6.2",
]

[tool.uv]
package = true
# python-semantic-release caps rich<15; Rich 15 works in practice for our usage.
override-dependencies = ["rich>=15.0"]

[tool.ruff]
fix = true
show-fixes = true
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
  "I",    # isort
  "F",    # Pyflakes
  "E",    # pycodestyle (errors)
  "W",    # pycodestyle (warnings)
  "N",    # pep8-naming
  "B",    # flake8-bugbear
  "A",    # flake8-builtins
  "D",    # pydocstyle
  "C4",   # flake8-comprehensions
  "PT",   # flake8-pytest-style
  "UP",   # pyupgrade
  "ARG",  # flake8-unused-arguments
  "TID",  # flake8-tidy-imports
  "SIM",  # flake8-simplify
  "TCH",  # flake8-type-checking
  "FLY",  # flynt
  "TRY",  # tryceratops
  "C901", # Cognitive complexity
]
ignore = [
  "B023",   # allow using local variable in for-loops
  "N817",   # allow CamelCase imported as acronym
  "TRY003", # allow long messages in exceptions
  "C901",   # allow complex functions
]
extend-ignore = [
  "D100", # undocumented-public-module
  "D101", # undocumented-public-class
  "D102", # undocumented-public-method
  "D103", # undocumented-public-function
  "D104", # undocumented-public-package
  "D105", # undocumented-magic-method
  "D106", # undocumented-public-nested-class
  "D107", # undocumented-public-init
  "D205", # blank-line-after-summary
  "D212", # multi-line-summary-first-line
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.isort]
known-first-party = ["parvelo"]

[tool.ty.environment]
python-version = "3.13"
root = ["./src"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
# Treat warning-level diagnostics as failures, mirroring a strict setup.
error-on-warning = true

[tool.semantic_release]
version_variables = ["src/parvelo/__init__.py:__version__"]
version_toml = ["pyproject.toml:project.version"]
upload_to_vcs_release = true
build_command = "uv build"
commit_message = "build(release): update version to {version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "conventional"
tag_format = "v{version}"
major_on_zero = true
allow_zero_version = true
no_git_verify = false
assets = ["uv.lock"]

[tool.semantic_release.branches.main]
match = "main"
prerelease_token = "rc"
prerelease = false

[tool.semantic_release.changelog]
mode = "init"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"

[tool.semantic_release.commit_parser_options]
allowed_tags = [
  "build",
  "chore",
  "ci",
  "docs",
  "feat",
  "fix",
  "perf",
  "style",
  "refactor",
  "test",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "build", "chore", "refactor"]
default_bump_level = 0

[tool.semantic_release.remote]
name = "origin"
type = "github"
token = { env = "GITHUB_TOKEN" }

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true
