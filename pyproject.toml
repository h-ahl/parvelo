[project]
name = "parvelo"
version = "0.1.0"
description = "Parallel map with an optional rich progress bar."
readme = "README.md"
requires-python = ">=3.13.0, <3.14.0"
dependencies = [
  "rich>=13.9.3",
]

[project.urls]
homepage = "https://github.com/supersubscript/parvelo"
repository = "https://github.com/supersubscript/parvelo"

[project.optional-dependencies]
lint = [
  "pre-commit>=4.0.1",
  "ty>=0.0.43",
  "ruff>=0.15.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest==8.3.2",
  "pytest-cov==5.0.0",
  "pytest-mock==3.14.0",
]
release = [
  "python-semantic-release>=9.19,<10.0",
  "twine>=6.0",
]

[tool.uv]
package = true

[tool.ty.environment]
python-version = "3.13"
root = ["./src"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
# Treat warning-level diagnostics as failures, mirroring a strict setup.
error-on-warning = true

[tool.semantic_release]
version_variables = ["src/parvelo/__init__.py:__version__"]
version_toml = ["pyproject.toml:project.version"]
upload_to_vcs_release = true
build_command = "uv build"
commit_message = "build(release): update version to {version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "conventional"
tag_format = "v{version}"
major_on_zero = true
allow_zero_version = true
no_git_verify = false
assets = ["uv.lock"]

[tool.semantic_release.branches.main]
match = "main"
prerelease_token = "rc"
prerelease = false

[tool.semantic_release.changelog]
mode = "init"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"

[tool.semantic_release.commit_parser_options]
allowed_tags = [
  "build",
  "chore",
  "ci",
  "docs",
  "feat",
  "fix",
  "perf",
  "style",
  "refactor",
  "test",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "build", "chore", "refactor"]
default_bump_level = 0

[tool.semantic_release.remote]
name = "origin"
type = "github"
token = { env = "GITHUB_TOKEN" }

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true
