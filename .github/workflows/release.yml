name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install release dependencies
        run: uv sync --group release

      - name: Configure git
        run: |
          git config --global --add safe.directory "*"
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local push.autoSetupRemote true

      - name: Force correct release branch
        run: |
          git checkout -B ${{ github.ref_name }} ${{ github.sha }}

      - name: Semantic Version Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Starting semantic-release version check..."

          TAG=$(uv run semantic-release --noop version --print-tag 2>/dev/null || echo "")
          LAST_TAG=$(uv run semantic-release --noop version --print-last-released-tag 2>/dev/null || echo "")

          echo "Current tag (calculated): $TAG"
          echo "Last released tag: $LAST_TAG"

          if [ -z "$TAG" ] || [ "$TAG" = "$LAST_TAG" ]; then
              echo "No release required. Latest tag is unchanged."
              echo "released=false" >> $GITHUB_OUTPUT
              exit 0
          fi

          echo "Release required. Updating version..."

          # Run semantic-release to update version, create tag, and push
          uv run semantic-release version

          echo "Release process completed."
          echo "released=true" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Release
        if: steps.release.outputs.released == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags
          uv run semantic-release publish --tag "${{ steps.release.outputs.tag }}"

  publish-pypi:
    name: Publish to PyPI
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/parvelo/
    permissions:
      id-token: write  # Required for trusted publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
